<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاليا - كونكريت وديكور</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f9f9f9; color: #333; margin: 0; padding: 0; direction: rtl; }
        header { background: #fff; padding: 15px; text-align: center; border-bottom: 1px solid #eee; }
        .container { max-width: 600px; margin: auto; padding: 15px; }
        .product-card { background: #fff; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; overflow: hidden; border: 1px solid #eee; position: relative; }
        .product-card img { width: 100%; height: auto; display: block; background: #fff; }
        .badge { position: absolute; top: 15px; right: 15px; background: #c87d55; color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .product-details { padding: 20px; }
        .product-details h3 { margin-top: 0; color: #222; }
        .product-details p { color: #666; font-size: 14px; line-height: 1.6; }
        .price-section { background: #fdfbf7; padding: 12px; border-radius: 8px; margin: 15px 0; border: 1px solid #f0e6dc; font-size: 14px; }
        .deposit { color: #8c5230; font-weight: bold; margin-top: 5px; }
        .action-buttons { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; }
        .btn-order { background: #222; color: #fff; }
        .btn-customize { background: #eef2f5; color: #333; }
    </style>
</head>
<body>

    <header>
        <h2>تاليا <span style="font-size: 14px; color: #666;">- صنعاء، اليمن</span></h2>
    </header>

    <div class="container">

        <!-- المنتج: الفازة المفردة فقط -->
        <div class="product-card">
            <img src="https://i.pinimg.com/736x/69/ec/bd/69ecbd2e9c18d172e269ecbd2e9c18d172e.jpg" alt="فازة صدى المفردة">
            <span class="badge">مميز</span>
            <div class="product-details">
                <h3>فازة "صدى" المعمارية المفردة</h3>
                <p>فازة كونكريت يدوية بتصميم متموج فريد وعنق محبوك بحبل الخيش الفاخر. قطعة فنية واحدة تضفي طابعاً أنيقاً ومميزاً على زوايا منزلك.</p>
                
                <div class="price-section">
                    <div>السعر الإجمالي: <span>2,500 ر.ي</span></div>
                    <div class="deposit">العربون المطلوب (50%): <span>1,250 ر.ي</span></div>
                    <div style="font-size: 12px; color: #888; margin-top: 3px;">المتبقي 1,250 ر.ي عند المعاينة والاستلام</div>
                </div>

                <div class="action-buttons">
                    <button class="btn-order" onclick="alert('جاري فتح نموذج سداد العربون 50% عبر محفظة جيب أو جوالي')">حجز بعربون 50%</button>
                    <button class="btn-customize">استوديو التخصيص</button>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
